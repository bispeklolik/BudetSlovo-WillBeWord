appId: com.slovo.transcriber
productName: Слово
copyright: Слово
directories:
  output: dist
files:
  - out/**
  - package.json
  # распаковщик 7z нужен только под Windows x64
  - '!node_modules/7zip-bin/{mac,linux}/**'
  - '!node_modules/7zip-bin/win/{arm64,ia32}/**'
# ffmpeg (импорт, волна, облако) и 7za (установка движка) — исполняемые файлы:
# из app.asar их не запустить, поэтому кладём рядом распакованными.
asarUnpack:
  - node_modules/ffmpeg-static/**
  - node_modules/7zip-bin/win/x64/**
win:
  target: nsis
  icon: build/icon.ico
  artifactName: Slovo-Setup-${version}.${ext}
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  shortcutName: Слово
  deleteAppDataOnUninstall: false
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
# Источник автообновлений и публикации релизов.
# owner будет проставлен реальным GitHub-логином перед публикацией.
publish:
  provider: github
  owner: bispeklolik
  repo: BudetSlovo-WillBeWord
  releaseType: release
